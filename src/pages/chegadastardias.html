<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar Atraso</title>

    <link rel="stylesheet" href="../style/chegadastardias.css">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >
</head>

<body>

    <main class="page-container">

        <!-- CABEÇALHO -->
        <header class="page-header">

            <div class="header-icon">
                <i class="bi bi-alarm"></i>
            </div>

            <div class="header-content">
                <h1>Registro de Atraso</h1>

                <p>
                    Informe os dados da sua chegada tardia.
                </p>
            </div>

            <button
                type="button"
                id="btnLogout"
                class="logout-button"
            >
                <i class="bi bi-box-arrow-right"></i>
                Sair
            </button>

        </header>


        <!-- FORMULÁRIO -->
        <form id="formAtraso">

            <!-- TURMA -->
            <div class="form-group full-width">

                <label for="turmas">
                    <i class="bi bi-people"></i>
                    Turma
                </label>

                <select id="turmas" required>

                    <option value="">
                        Selecione sua turma
                    </option>

                    <option value="AATI M1">
                        AATI M1
                    </option>

                    <option value="AAPCP V3">
                        AAPCP V3
                    </option>

                    <option value="AAWEG V1">
                        AAWEG V1
                    </option>

                    <option value="AAMNT">
                        AAMNT
                    </option>

                </select>

            </div>


            <!-- PROFESSOR -->
            <div class="form-group">

                <label for="professor">
                    <i class="bi bi-person"></i>
                    Professor
                </label>

                <select id="professor" required>

                    <option value="">
                        Selecione
                    </option>

                    <option value="Willy Manke">
                        Willy Manke
                    </option>

                    <option value="Celina">
                        Celina
                    </option>

                    <option value="Gustavo">
                        Gustavo
                    </option>

                    <option value="Alex">
                        Alex
                    </option>

                </select>

            </div>


            <!-- MOTIVO -->
            <div class="form-group">

                <label>
                    <i class="bi bi-exclamation-circle"></i>
                    Motivo do atraso
                </label>

                <div class="motivos">

                    <label class="motivo-card">

                        <input
                            type="radio"
                            name="motivo_atraso"
                            value="Questões escolares"
                            required
                        >

                        <span>
                            <i class="bi bi-book"></i>
                            Questões escolares
                        </span>

                    </label>


                    <label class="motivo-card">

                        <input
                            type="radio"
                            name="motivo_atraso"
                            value="Atraso ônibus"
                        >

                        <span>
                            <i class="bi bi-bus-front"></i>
                            Atraso ônibus
                        </span>

                    </label>


                    <label class="motivo-card">

                        <input
                            type="radio"
                            name="motivo_atraso"
                            value="Perdeu a hora"
                        >

                        <span>
                            <i class="bi bi-alarm"></i>
                            Perdeu a hora
                        </span>

                    </label>


                    <label class="motivo-card">

                        <input
                            type="radio"
                            name="motivo_atraso"
                            value="Saúde / bem-estar"
                        >

                        <span>
                            <i class="bi bi-heart-pulse"></i>
                            Saúde / bem-estar
                        </span>

                    </label>

                </div>

            </div>


            <!-- DESCRIÇÃO -->
            <div class="form-group full-width">

                <label for="descricao">
                    <i class="bi bi-chat-left-text"></i>
                    Descrição
                </label>

                <textarea
                    id="descricao"
                    maxlength="300"
                    placeholder="Descreva o motivo do atraso..."
                ></textarea>

                <div class="character-counter">
                    <span id="charCounter">0</span>
                    / 300
                </div>

            </div>


            <!-- MENSAGEM -->
            <div
                id="formMessage"
                class="message"
            ></div>


            <!-- BOTÕES -->
            <div class="form-actions">

                <a
                    href="./logAluno.html"
                    class="secondary-button"
                >
                    <i class="bi bi-clock-history"></i>
                    Meus registros
                </a>

                <button
                    type="submit"
                    id="btnRegistrar"
                    class="primary-button"
                >
                    <i class="bi bi-check2-circle"></i>
                    Registrar atraso
                </button>

            </div>

        </form>

    </main>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- CONFIGURAÇÃO -->
    <script src="../script/config.js"></script>

    <!-- JAVASCRIPT DA PÁGINA -->
    <script src="../script/ChegadaTardias.js"></script>

</body>

</html>
