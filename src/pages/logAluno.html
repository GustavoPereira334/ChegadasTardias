<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meus Registros</title>

    <link
        rel="stylesheet"
        href="../style/logAluno.css"
    >

</head>

<body>

    <main class="dashboard">

        <header class="dashboard-header">

            <div>

                <h1>Meus Registros</h1>

                <p id="welcomeMessage">
                    Seus registros de chegada tardia
                </p>

            </div>

            <div class="header-actions">

                <a
                    href="./chegadastardias.html"
                    class="primary-button"
                >
                    Novo registro
                </a>

                <button
                    id="btnLogout"
                    class="logout-button"
                >
                    Sair
                </button>

            </div>

        </header>

        <section class="filters">

            <input
                type="search"
                id="searchInput"
                placeholder="Buscar registros..."
            >

            <select id="areaBox">

                <option value="todasTurmas">
                    Todas as turmas
                </option>

            </select>

        </section>

        <section class="cards">

            <article class="card">

                <span
                    class="card-value"
                    id="totalAtrasos"
                >
                    0
                </span>

                <span class="card-label">
                    Total de atrasos
                </span>

            </article>

            <article class="card">

                <span
                    class="card-value"
                    id="turmasAfetadas"
                >
                    0
                </span>

                <span class="card-label">
                    Turmas afetadas
                </span>

            </article>

            <article class="card">

                <span
                    class="card-value"
                    id="perdeuHora"
                >
                    0
                </span>

                <span class="card-label">
                    Perdeu a hora
                </span>

            </article>

        </section>

        <section class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>DATA</th>
                        <th>TURMA</th>
                        <th>PROFESSOR</th>
                        <th>MOTIVO</th>
                    </tr>

                </thead>

                <tbody id="tabelaCorpo"></tbody>

            </table>

        </section>

        <p
            id="pageMessage"
            class="message"
        ></p>

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="../script/config.js"></script>
    <script src="../script/logAluno.js"></script>

</body>

</html>
