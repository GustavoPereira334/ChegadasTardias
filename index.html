<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chegadas Tardias | Login</title>

    <link rel="stylesheet" href="src/style/index.css">
</head>

<body>

    <main class="login-container">

        <section class="login-panel">

            <div class="login-content">

                <h1>Login</h1>

                <p class="login-subtitle">
                    Acesse o sistema de registro de chegadas tardias.
                </p>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="email">E-mail</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">

                        <label for="senha">Senha</label>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                    <button type="submit" id="btnEntrar">
                        Entrar
                    </button>

                    <p id="loginMessage" class="message"></p>

                </form>

                <div class="login-footer">
                    <span>Aprendizado Industrial SENAI</span>
                </div>

            </div>

        </section>

        <section class="login-image">

            <img
                src="src/utils/images/unnamed.png"
                alt="SENAI"
            >

        </section>

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="src/script/config.js"></script>
    <script src="src/script/login.js"></script>

</body>

</html>
